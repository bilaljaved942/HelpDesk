# Local PostgreSQL 17 with pgvector (vector search for the help docs).
# Port 5434 so it can run next to StageAI's database (5433).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
